# Server Configuration
# 设置服务启动端口号为8080
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3308/librarymanagement?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
# MySQL 8 JDBC驱动类
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=LibraryManagementSecretKey2023ForTokenGenerationAndValidation
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.com.library.admin=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n 